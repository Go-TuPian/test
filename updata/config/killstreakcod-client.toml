#Play verified original English multiplayer radio dialogue.
#播放已核对的原版英文无线电语音。
#Also requires nonzero radioVolume, Minecraft Voice/Speech and Master volume.
#同时需要 radioVolume、原版语音音量和主音量大于零；关闭播报也会停止对应字幕。
originalRadio = true
#Show localized captions and the speaker label for the actual played voice variant.
#显示当前播放语音对应的字幕与播报人物名称，未翻译的语言回退为英文。
#Captions follow actual radio playback. F1 hides captions; vanilla subtitle settings are independent.
#字幕跟随实际播放的无线电，F1 隐藏字幕；原版辅助字幕开关不控制此处字幕。
radioSubtitles = true
#Range: 0.0 ~ 1.0
radioVolume = 0.75
#Maximum live source sprites, shared by all killstreaks.
#所有连杀共用的同时存活特效数量上限。
#Range: 32 ~ 512
effectSpriteLimit = 256
#炮艇地面渲染半径，单位为区块；实际不超过服务端发送范围。
#Gunship ground render radius in chunks, bounded by the server watch radius.
#Range: 16 ~ 32
gunshipViewDistance = 32
#右侧连杀栏：0详细，1默认（图标与进度条），2精简（仅图标）。
#Range: 0 ~ 2
rewardRailStyle = 1
#连续3秒未呼叫连杀后收为右侧竖条，呼叫或获取新奖励时展开。
rewardRailAutoHide = false
oneKia = false

