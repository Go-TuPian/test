
#对本实例所有世界生效；联机使用服务端配置。
#Global rules; multiplayer uses the hosting server.
[earning]
	#按得分而非击杀获取奖励；切换时保留库存、清空未完成进度。
	#Default: false
	scorestreaks = false
	#开启后独立循环累计且死亡不清进度；关闭后每条命每种奖励只自然获取一次。
	#Default: true
	repeatableRewards = false
	#只计敌对生物、Boss 和敌方玩家；关闭后其他非友军生物也可计数。
	#Default: true
	hostileKillsOnly = false

[rewards]
	#是否允许获取与使用核弹，默认关闭。
	#Default: false
	mgbEnabled = false
	#是否允许获取与使用无畏战甲，默认关闭。
	#Default: false
	juggernautEnabled = false
	#核弹是否伤害呼叫者及其队友；默认关闭，遵循计分板队伍和本世界队友白名单。Nuclear friendly fire, including the caller; disabled by default.
	#Default: false
	mgbFriendlyDamage = false

[research]
	#是否启用总部终端研究与预付材料系统。关闭后所有玩家直接使用连杀模式，且不应用任何升级；既有研究保留。
	#Default: true
	terminalEnabled = false
	#禁用升级研究、装配及效果，保留已保存的研究与装配选择。
	#Default: false
	disableUpgrades = true

[airspace]
	#是否检查航线与机体上下三格空间并自动抬升，默认关闭；关闭不改变地狱禁飞规则。
	#Default: false
	airspaceChecks = true
	#炮艇遥控地面区块观察半径，单位为区块。
	#Gunship ground watch radius in chunks.
	#Range: 16 ~ 32
	gunshipViewDistance = 32

#武器基础伤害，1 点为半颗心；0 可关闭该武器的伤害。
