[targeting]
	#将所有生物视为敌对目标；玩家队友、白名单及所属单位仍受保护。Affects targeting and kill credit; allies remain protected.
	#Default: false
	allMobsHostile = false
	#额外敌对实体注册名，最多64种、总长1024字符；不存在的类型会保留，便于兼容可选模组。
	#Extra hostile entity registry IDs; at most 64 types and 1024 characters. Allies remain protected.
	#Example: ["minecraft:cow", "othermod:creature"]
	hostileEntityTypes = []

#地形破坏需同时打开全局及单项开关，默认关闭。
#Both global and per-streak switches are required.
